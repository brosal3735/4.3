<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Card Preview</title>

  <!-- Provided student files -->
  <script src="modernizr.custom.65897.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Optional minimal helpers in case styles.css is empty */
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; background: #f7f7f7; }
    .card {
      max-width: 680px; margin: 0 auto; padding: 2rem;
      background: white; border-radius: 16px; box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    .card h1 { margin-top: 0; }
    .message { white-space: pre-wrap; font-size: 1.25rem; line-height: 1.5; }
    .toolbar { display: flex; gap: .5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Preview</h1>
    <div id="card" class="message" aria-live="polite">Your message will appear here.</div>
    <div class="toolbar">
      <button type="button" onclick="window.print()">Print</button>
      <button type="button" onclick="window.close()">Close</button>
    </div>
  </div>

  <noscript>
    <p>Please enable JavaScript to view the greeting card preview.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
